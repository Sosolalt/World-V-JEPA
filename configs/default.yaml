# Mini V-JEPA — config schema (FROZEN, shared across all configs).
#
# Top-level sections: data, model, training.
#
# data:
#   n_balls (int)                     number of balls in the simulation
#   n_sequences (int)                 number of sequences to generate
#   sequence_length (int)             frames per sequence (default 32)
#   frame_size (int)                  square frame side in pixels (default 64)
#   table_ratio (list[int, int])      table aspect ratio, e.g. [2, 1]
#   ball_radius (float)               radius in normalized table units
#   physics_fps (int)                 simulator step rate in Hz
#   init_strategies (dict[str,float]) initial-condition strategy name -> sampling weight;
#                                     keys: break, midgame_cluster, midgame_spread,
#                                           two_ball, random_velocities
#   output_path (str)                 NPZ output path for the generated dataset
#
# model:
#   latent_dim (int)                  per-token embedding dimension
#   spatial_tokens (int)              spatial tokens per frame (8x8 = 64)
#   context_frames (int)              number of frames in the context window
#   predictor_layers (int)            transformer predictor depth
#   predictor_heads (int)             transformer predictor attention heads
#   predictor_ffn (int)               predictor FFN hidden size
#   delta_t_min (int)                 minimum prediction horizon (in frames)
#   delta_t_max (int)                 maximum prediction horizon (in frames)
#
# training:
#   batch_size (int)
#   epochs (int)
#   lr_peak (float)                   peak learning rate after warmup
#   lr_final (float)                  final learning rate at end of cosine decay
#   warmup_epochs (int)
#   weight_decay_encoder (float)
#   weight_decay_predictor (float)
#   grad_clip (float)
#   ema_tau_start (float)             EMA decay at training start
#   ema_tau_end (float)               EMA decay at training end (cosine schedule)
#   var_loss_weight (float)           VICReg variance term weight
#   cov_loss_weight (float)           VICReg covariance term weight (decorrelates dims)
#   reg_target (str)                  "z_pred" | "context" | "both"; where var/cov reg is applied
#   loss_fn (str)                     "mse" | "smooth_l1" | "l1"; prediction-vs-target loss
#   mask_ratio (float)                Fraction of context tokens replaced with the learned
#                                     mask_token before the predictor (V-JEPA-style asymmetry)
#   collapse_eff_rank_threshold       effective_rank below this counts as collapsed
#                                     (applied to BOTH z_pred and ctx_effective_rank)
#   collapse_patience_epochs          abort training after this many consecutive collapsed epochs
#   checkpoint_every (int)            save a checkpoint every N epochs
#   max_checkpoints (int)             max number of checkpoints kept on disk
#   seed (int)
#
# baseline_overrides (optional):
#   any training key can be shadowed here for the pixel baseline only.
#   used to give the pixel decoder a lower LR + value-clip than V-JEPA.

data:
  n_balls: 9
  n_sequences: 10000
  sequence_length: 32
  frame_size: 64
  table_ratio: [2, 1]
  ball_radius: 0.03
  physics_fps: 120
  init_strategies:
    break: 0.30
    midgame_cluster: 0.20
    midgame_spread: 0.20
    two_ball: 0.15
    random_velocities: 0.15
  output_path: "data/default.npz"

model:
  latent_dim: 128
  spatial_tokens: 64
  context_frames: 4
  predictor_layers: 3
  predictor_heads: 4
  predictor_ffn: 256
  delta_t_min: 1
  delta_t_max: 12

training:
  batch_size: 64
  epochs: 150
  # iter-3: lr_peak lowered from 1.5e-4 to 5e-5 after E_lowlr showed it
  # eliminates the late-stage z_pred volatility seen in E7 at the higher rate
  # (z_pred went 79->7->14 over ep27-29 at 1.5e-4; at 5e-5 it stays 60-80).
  lr_peak: 5.0e-5
  lr_final: 1.0e-5
  warmup_epochs: 10
  weight_decay_encoder: 0.05
  weight_decay_predictor: 0.0
  grad_clip: 1.0
  # iter-3: per-element value clip on top of grad-norm clip. The kitchen-sink
  # loss surface has occasional batch-level numerical spikes (validation v1
  # hit a non-finite loss at ep20 batch 3 in one of two runs; pure
  # stochasticity but the NaN-abort catches it. Value clip provides a second
  # line of defense without altering normal training.)
  grad_value_clip: 0.5
  # iter-3: ema_tau_start dropped from 0.996 -> 0.99. A near-static target
  # encoder makes the "match a constant" trivial solution too easy.
  ema_tau_start: 0.99
  ema_tau_end: 1.0
  var_loss_weight: 25.0
  # iter-3: cov_loss_weight raised from 1.0 -> 25.0 so the cov gradient
  # matches the var gradient in magnitude (cov at d=128 is naturally smaller
  # than at the d=8192 VICReg paper's scale, so weight 1 was undersized).
  cov_loss_weight: 25.0
  # iter-3: reg_target switched from default (z_pred only) to "both".
  # Applying var/cov reg only to z_pred lets the predictor satisfy the
  # constraint via its own pos_embed + query_tokens + mask_token while the
  # encoder collapses silently (see strategies_log.md E4 case study).
  reg_target: both
  # Phase 2 (canonical V-JEPA): pixel-patch tubelet masking BEFORE encoder
  # replaces the iter-3 post-encoder token replacement. Multi-block protocol
  # per V-JEPA paper: 4 short blocks at 15% spatial coverage + 1 long block
  # at 50% coverage; 2-frame tubelets; 8-pixel-grid-aligned blocks.
  # Legacy `mask_ratio` is rejected (fail-loud at train.py startup) when it
  # appears without `mask_strategy` to prevent silent fallback.
  mask_strategy: tubelet
  n_short_blocks: 4
  short_coverage: 0.15
  n_long_blocks: 1
  long_coverage: 0.50
  tubelet_t: 2
  loss_fn: l1
  collapse_eff_rank_threshold: 5.0
  collapse_patience_epochs: 8
  checkpoint_every: 25
  max_checkpoints: 4
  seed: 42

baseline_overrides:
  # iter-3: dropped from 5e-5 -> 2e-5 after iter-3 attempt #1 NaN'd at ep40
  # with 5e-5 + clamp output. The model was training healthily (pixel_mse
  # dropping 0.018 -> 0.015) right up to the NaN, so it's a one-off numerical
  # edge from a bad batch + AdamW state, not a training failure. 2e-5 + value
  # clip should absorb it.
  lr_peak: 2.0e-5
  grad_clip: 1.0
  grad_value_clip: 0.5
